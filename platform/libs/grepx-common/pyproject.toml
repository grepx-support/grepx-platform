[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grepx-common"
version = "0.1.0"
description = "grepx_common - value objects every product shares, configured per deployment (no product words in code)."
requires-python = ">=3.10"
# GrepX libraries listed here are checked against the imports by platform/tools/test/test_deps.py
dependencies = [
    "grepx-config",
]

[tool.setuptools.packages.find]
include = ["grepx_common*"]
