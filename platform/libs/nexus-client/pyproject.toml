[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-client"
version = "0.1.0"
description = "Python SDK for connecting to nexus_server"
requires-python = ">=3.10"
# GrepX libraries listed here are checked against the imports by platform/tools/test/test_deps.py
dependencies = [
    "grepx-config",
]

[tool.setuptools.packages.find]
include = ["nexus_api*"]
