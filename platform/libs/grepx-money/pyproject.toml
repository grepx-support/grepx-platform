[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grepx-money"
version = "0.1.0"
description = "grepx_money - exact money: amounts in whole cents, half-up rounding, document totals with discount and tax."
requires-python = ">=3.10"
# GrepX libraries listed here are checked against the imports by platform/tools/test/test_deps.py
dependencies = []

[tool.setuptools.packages.find]
include = ["grepx_money*"]
