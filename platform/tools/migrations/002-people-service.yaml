# The product's person record moves to the generic people-service: blood donation's `donors` rows become `people` rows
# (same keys, so logins, bookings, donations and referrals keep pointing at the same person). The blood fields stay on
# the row; people-service validates them through the product's profile plugin. Run after 001, services stopped:
#   scripts/run.sh stop && scripts/run.sh backup && scripts/run.sh migrate 002-people-service && scripts/run.sh start
# Before starting, the deployment file must name people-service as the person record (person: table: people).
tables:
  donors: people
table_fields:
  people: {donor_id: person_id}
