# Database engines for services that are configured to use them (started by scripts/infra.sh via profiles).
name: grepx-infra
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grepx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grepx}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grepx}"], interval: 3s, retries: 30 }
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    profiles: [mongo]
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: ["mongo-data:/data/db"]
volumes:
  pg-data:
  mongo-data:
